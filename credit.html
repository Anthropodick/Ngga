<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Credit — Main Dashboard</title>
<style>
  :root{
    --bg:#0a0e14; --card:#151b28; --card-2:#1b2233; --border:#242c3d;
    --text:#e6edf3; --muted:#8b98ab;
    --accent:#6366f1; --accent-2:#8b5cf6;
    --danger:#ef4444; --warn:#f59e0b; --success:#10b981;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background:radial-gradient(1200px 600px at 10% -10%,rgba(99,102,241,.15),transparent 60%),
               radial-gradient(900px 500px at 110% 10%,rgba(139,92,246,.12),transparent 60%),
               var(--bg);
    color:var(--text); min-height:100vh; line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  header{
    position:sticky;top:0;z-index:50;
    background:rgba(10,14,20,.8);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid var(--border);
  }
  .topbar{
    max-width:1200px;margin:0 auto;padding:14px 20px;
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  }
  .back-btn{
    display:inline-flex;align-items:center;gap:6px;
    background:var(--card-2);border:1px solid var(--border);
    color:var(--text);font-family:inherit;font-weight:600;font-size:13px;
    padding:8px 14px;border-radius:10px;cursor:pointer;
    transition:background .2s, transform .15s;text-decoration:none;
  }
  .back-btn:hover{background:#222a3d;}
  .back-btn:active{transform:scale(.97);}
  .title-block{flex:1;}
  .title-block h1{font-size:16px;font-weight:700;}
  .title-block p{font-size:12px;color:var(--muted);}

  main{max-width:760px;margin:0 auto;padding:30px 20px 60px;}

  .credit-hero{
    background:linear-gradient(135deg,rgba(99,102,241,.15),rgba(139,92,246,.08));
    border:1px solid rgba(99,102,241,.3);
    border-radius:20px;
    padding:34px 26px;
    text-align:center;
    margin-bottom:22px;
    position:relative;
    overflow:hidden;
  }
  .credit-hero::before{
    content:'';position:absolute;top:-50%;right:-20%;
    width:280px;height:280px;border-radius:50%;
    background:radial-gradient(circle,rgba(139,92,246,.25),transparent 70%);
    pointer-events:none;
  }
  .credit-hero .label{
    font-size:12px;font-weight:700;letter-spacing:1.2px;
    text-transform:uppercase;color:#c7d2fe;
    margin-bottom:10px;
  }
  .credit-big{
    font-size:64px;font-weight:800;line-height:1;
    background:linear-gradient(135deg,#a5b4fc,#c4b5fd);
    -webkit-background-clip:text;background-clip:text;
    color:transparent;
    margin-bottom:6px;
    font-family:'SF Mono',Menlo,Consolas,monospace;
  }
  .credit-sub{color:var(--muted);font-size:13px;margin-bottom:22px;}

  .btn{
    border:none;cursor:pointer;font-family:inherit;
    font-weight:600;font-size:14px;padding:13px 22px;border-radius:11px;
    transition:transform .15s, box-shadow .2s, background .2s;
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
  }
  .btn:active{transform:scale(.97);}
  .btn-primary{
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    color:#fff;box-shadow:0 8px 22px rgba(99,102,241,.4);
  }
  .btn-primary:hover{box-shadow:0 10px 28px rgba(99,102,241,.55);}
  .btn-primary:disabled{
    opacity:.5;cursor:not-allowed;
    box-shadow:none;background:#2b3550;color:#8b98ab;
  }

  .panel{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:22px;
    margin-bottom:18px;
  }
  .panel h2{
    font-size:13px;font-weight:700;letter-spacing:.5px;
    text-transform:uppercase;color:var(--muted);
    margin-bottom:14px;
    display:flex;align-items:center;gap:8px;
  }
  .panel h2::before{
    content:'';width:3px;height:14px;border-radius:2px;
    background:linear-gradient(180deg,var(--accent),var(--accent-2));
  }

  .info-row{
    display:flex;justify-content:space-between;align-items:center;
    padding:12px 0;border-bottom:1px solid var(--border);
    font-size:13.5px;
  }
  .info-row:last-child{border-bottom:none;}
  .info-row .k{color:var(--muted);}
  .info-row .v{font-weight:600;font-family:'SF Mono',Menlo,Consolas,monospace;color:#c7d2fe;}
  .info-row .v.green{color:#6ee7b7;}
  .info-row .v.warn{color:#fcd34d;}

  .history-list{display:flex;flex-direction:column;gap:8px;}
  .history-item{
    display:flex;justify-content:space-between;align-items:center;
    padding:11px 13px;border-radius:10px;
    background:var(--card-2);border:1px solid var(--border);
    font-size:13px;
  }
  .history-item .left{display:flex;align-items:center;gap:10px;}
  .history-item .icon{
    width:28px;height:28px;border-radius:8px;
    display:grid;place-items:center;
    background:rgba(16,185,129,.15);color:#6ee7b7;
    flex-shrink:0;
  }
  .history-item .icon.weekly{background:rgba(99,102,241,.15);color:#c7d2fe;}
  .history-item .icon.welcome{background:rgba(245,158,11,.15);color:#fcd34d;}
  .history-item .type{font-weight:600;color:var(--text);}
  .history-item .date{font-size:11px;color:var(--muted);}
  .history-item .amount{
    font-weight:800;color:#6ee7b7;
    font-family:'SF Mono',Menlo,Consolas,monospace;
  }
  .empty-state{
    text-align:center;color:var(--muted);font-size:13px;padding:20px 0;
  }

  .toast-wrap{
    position:fixed;top:80px;right:16px;left:16px;z-index:300;
    display:flex;flex-direction:column;align-items:flex-end;gap:10px;
    pointer-events:none;
  }
  .toast{
    pointer-events:auto;max-width:360px;width:100%;
    background:linear-gradient(135deg,#1a2233,#141a27);
    border:1px solid var(--border);border-left:3px solid var(--warn);
    border-radius:12px;padding:12px 14px;
    font-size:13px;color:var(--text);
    box-shadow:0 12px 34px rgba(0,0,0,.5);
    display:flex;gap:10px;align-items:flex-start;
    animation:slideIn .28s cubic-bezier(.2,.9,.3,1);
  }
  .toast.success{border-left-color:var(--success);}
  .toast svg{width:18px;height:18px;flex-shrink:0;margin-top:1px;}
  .toast.success svg{color:var(--success);}
  .toast.warn svg{color:var(--warn);}
  @keyframes slideIn{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:translateX(0)}}

  @media (max-width:640px){
    .topbar{padding:12px 14px;}
    main{padding:20px 14px 50px;}
    .credit-hero{padding:26px 18px;}
    .credit-big{font-size:52px;}
    .panel{padding:18px;}
    .toast-wrap{top:70px;}
  }
</style>
</head>
<body>

<header>
  <div class="topbar">
    <a href="index.html" class="back-btn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      Back
    </a>
    <div class="title-block">
      <h1>Credit</h1>
      <p>Kelola credit & klaim mingguan</p>
    </div>
  </div>
</header>

<main>
  <div class="credit-hero">
    <div class="label">Credits Available</div>
    <div class="credit-big" id="creditBig">1</div>
    <div class="credit-sub">Setiap tools akan memakai 1 credit</div>
    <button class="btn btn-primary" id="claimBtn">Claim Weekly Credit</button>
  </div>

  <div class="panel">
    <h2>Informasi Klaim</h2>
    <div class="info-row">
      <span class="k">User</span>
      <span class="v" id="infoUser">-</span>
    </div>
    <div class="info-row">
      <span class="k">Role</span>
      <span class="v" id="infoRole">-</span>
    </div>
    <div class="info-row">
      <span class="k">Klaim Terakhir</span>
      <span class="v" id="infoLast">Belum pernah</span>
    </div>
    <div class="info-row">
      <span class="k">Klaim Berikutnya</span>
      <span class="v" id="infoNext">Tersedia sekarang</span>
    </div>
  </div>

  <div class="panel">
    <h2>Riwayat Credit</h2>
    <div class="history-list" id="historyList"></div>
  </div>
</main>

<div class="toast-wrap" id="toastWrap"></div>

<script src="config.js"></script>
<script>
(function(){
  'use strict';

  document.documentElement.style.visibility = 'hidden';
  const session = Auth.requireLogin();
  if (!session) return;
  document.documentElement.style.visibility = '';

  const creditBig = document.getElementById('creditBig');
  const claimBtn  = document.getElementById('claimBtn');
  const toastWrap = document.getElementById('toastWrap');

  const fmtDate = (ts) => {
    if (!ts) return 'Belum pernah';
    const d = new Date(ts);
    return d.toLocaleDateString('id-ID', {
      day: '2-digit', month: 'short', year: 'numeric',
      hour: '2-digit', minute: '2-digit'
    });
  };

  const fmtCountdown = (ms) => {
    if (ms <= 0) return 'Tersedia sekarang';
    const totalMin = Math.ceil(ms / 60000);
    const days = Math.floor(totalMin / 1440);
    const hours = Math.floor((totalMin % 1440) / 60);
    const mins = totalMin % 60;
    if (days > 0) return days + ' hari ' + hours + ' jam lagi';
    if (hours > 0) return hours + ' jam ' + mins + ' menit lagi';
    return mins + ' menit lagi';
  };

  function showToast(msg, type){
    type = type || 'warn';
    const icons = {
      success:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>',
      warn:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>'
    };
    const el = document.createElement('div');
    el.className = 'toast ' + type;
    el.innerHTML = (icons[type] || icons.warn) + '<div>' + msg + '</div>';
    toastWrap.appendChild(el);
    setTimeout(function(){
      el.style.transition = 'opacity .3s, transform .3s';
      el.style.opacity = '0'; el.style.transform = 'translateX(30px)';
      setTimeout(function(){ el.remove(); }, 300);
    }, 3800);
  }

  function render(){
    const s = Credit.init(session.user);
    const remaining = Credit.getRemainingMs(session.user);

    creditBig.textContent = s.credits;
    document.getElementById('infoUser').textContent = session.user;
    document.getElementById('infoRole').textContent = session.role || 'User';
    document.getElementById('infoLast').textContent = s.lastClaim ? fmtDate(s.lastClaim) : 'Belum pernah';

    const infoNext = document.getElementById('infoNext');
    if (remaining > 0 && s.credits > 0) {
      infoNext.textContent = fmtCountdown(remaining);
      infoNext.className = 'v warn';
    } else {
      infoNext.textContent = 'Tersedia sekarang';
      infoNext.className = 'v green';
    }

    // Riwayat
    const hist = document.getElementById('historyList');
    hist.innerHTML = '';
    if (!s.history || s.history.length === 0) {
      hist.innerHTML = '<div class="empty-state">Belum ada riwayat.</div>';
    } else {
      s.history.forEach(function(h){
        const item = document.createElement('div');
        item.className = 'history-item';
        const label = h.type === 'weekly' ? 'Weekly Claim'
                    : h.type === 'welcome' ? 'Welcome Bonus'
                    : 'Credit';
        const iconSvg = h.type === 'weekly'
          ? '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 12 20 22 4 22 4 12"/><rect x="2" y="7" width="20" height="5"/><line x1="12" y1="22" x2="12" y2="7"/><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"/><path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/></svg>'
          : h.type === 'welcome'
          ? '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15 9 22 9 17 14 19 22 12 17 5 22 7 14 2 9 9 9 12 2"/></svg>'
          : '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/></svg>';

        item.innerHTML =
          '<div class="left">' +
            '<div class="icon ' + h.type + '">' + iconSvg + '</div>' +
            '<div>' +
              '<div class="type">' + label + '</div>' +
              '<div class="date">' + fmtDate(h.at) + '</div>' +
            '</div>' +
          '</div>' +
          '<div class="amount">+' + h.amount + '</div>';
        hist.appendChild(item);
      });
    }

    // Disable tombol kalau belum waktunya
    if (remaining > 0 && s.credits > 0) {
      claimBtn.disabled = true;
      claimBtn.textContent = 'Tersedia ' + fmtCountdown(remaining);
    } else {
      claimBtn.disabled = false;
      claimBtn.textContent = 'Claim Weekly Credit';
    }
  }

  claimBtn.addEventListener('click', function(){
    const res = Credit.claim(session.user);
    if (!res.ok) {
      const days = Math.ceil(res.remaining / (24*60*60*1000));
      showToast('<strong>Weekly credit already claimed.</strong><br/>Next claim available in ' + days + ' days.', 'warn');
      return;
    }
    showToast('<strong>Weekly credit claimed!</strong><br/>+1 credit added to your account.', 'success');
    render();
  });

  render();

  // Auto refresh countdown tiap 30 detik
  setInterval(render, 30000);
})();
</script>
</body>
</html>
