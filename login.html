<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Login — Main Dashboard</title>
<style>
  :root{
    --bg:#0a0e14; --card:#151b28; --border:#242c3d;
    --text:#e6edf3; --muted:#8b98ab;
    --accent:#6366f1; --accent-2:#8b5cf6;
    --danger:#ef4444; --success:#10b981;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background:radial-gradient(1200px 600px at 10% -10%,rgba(99,102,241,.18),transparent 60%),
               radial-gradient(900px 500px at 110% 10%,rgba(139,92,246,.15),transparent 60%),
               var(--bg);
    color:var(--text); min-height:100vh;
    display:grid;place-items:center;padding:20px;
    -webkit-font-smoothing:antialiased;
  }
  .login-card{
    width:100%;max-width:400px;
    background:linear-gradient(180deg,#141a27,#101622);
    border:1px solid var(--border);border-radius:20px;
    padding:32px 26px 26px;
    box-shadow:0 30px 80px rgba(0,0,0,.6);
    animation:pop .4s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes pop{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
  .logo-big{
    width:64px;height:64px;margin:0 auto 18px;border-radius:18px;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    display:grid;place-items:center;color:#fff;font-weight:800;font-size:26px;
    box-shadow:0 12px 34px rgba(99,102,241,.5);
  }
  h1{font-size:20px;font-weight:700;text-align:center;margin-bottom:6px;}
  .sub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:24px;}
  .field{margin-bottom:14px;}
  .field label{
    display:block;font-size:12px;font-weight:600;color:var(--muted);
    margin-bottom:6px;letter-spacing:.3px;text-transform:uppercase;
  }
  .field input{
    width:100%;padding:12px 14px;background:var(--card);
    border:1px solid var(--border);border-radius:10px;
    color:var(--text);font-size:14px;font-family:inherit;outline:none;
    transition:border-color .2s, box-shadow .2s;
  }
  .field input:focus{
    border-color:rgba(99,102,241,.6);
    box-shadow:0 0 0 3px rgba(99,102,241,.18);
  }
  .row{display:flex;justify-content:space-between;align-items:center;margin:14px 0 18px;font-size:12.5px;}
  .row label{display:flex;align-items:center;gap:6px;color:var(--muted);cursor:pointer;}
  .row a{color:#a5b4fc;text-decoration:none;font-weight:600;cursor:pointer;}
  .row a:hover{text-decoration:underline;}
  .btn{
    width:100%;border:none;cursor:pointer;font-family:inherit;
    font-weight:600;font-size:14px;padding:13px;border-radius:11px;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    color:#fff;box-shadow:0 8px 22px rgba(99,102,241,.4);
    transition:transform .15s, box-shadow .2s;
  }
  .btn:hover{box-shadow:0 10px 28px rgba(99,102,241,.55);}
  .btn:active{transform:scale(.98);}
  .btn[disabled]{opacity:.6;cursor:not-allowed;}
  .err{
    display:none;background:rgba(239,68,68,.1);
    border:1px solid rgba(239,68,68,.35);color:#fca5a5;
    border-radius:10px;padding:10px 12px;font-size:12.5px;
    margin-bottom:14px;text-align:center;
  }
  .err.show{display:block;}
  .hint{
    text-align:center;font-size:12px;color:var(--muted);
    margin-top:18px;line-height:1.6;
  }
  .hint code{
    background:var(--card);padding:2px 6px;border-radius:6px;
    color:#c7d2fe;font-size:11.5px;
  }
</style>
</head>
<body>

<form class="login-card" id="loginForm" autocomplete="on" novalidate>
  <div class="logo-big">M</div>
  <h1>Welcome Back</h1>
  <p class="sub">Masuk untuk mengakses Main Dashboard</p>

  <div class="err" id="errBox">Username atau password salah.</div>

  <div class="field">
    <label for="username">Username</label>
    <input type="text" id="username" placeholder="masukkan username"
           autocomplete="username" autofocus required />
  </div>

  <div class="field">
    <label for="password">Password</label>
    <input type="password" id="password" placeholder="••••••••"
           autocomplete="current-password" required />
  </div>

  <div class="row">
    <label><input type="checkbox" id="remember" checked /> Remember me (7 hari)</label>
    <a id="forgotLink">Forgot?</a>
  </div>

  <button type="submit" class="btn" id="submitBtn">Sign In</button>

  <p class="hint">
    Demo: <code>admin</code> / <code>admin123</code>
  </p>
</form>

<script>
(function () {
  'use strict';

  const USE_API = location.protocol !== 'file:'; // file:// → pakai mock lokal
  const MOCK_KEY = 'mock_session_v1';
  const MOCK_USER = 'admin';
  const MOCK_PASS = 'admin123';

  const form     = document.getElementById('loginForm');
  const errBox   = document.getElementById('errBox');
  const btn      = document.getElementById('submitBtn');
  const userIn   = document.getElementById('username');
  const passIn   = document.getElementById('password');
  const rememberIn = document.getElementById('remember');

  /* ---------- Cek session yang sudah ada → redirect ---------- */
  (async function checkExisting() {
    const session = await getSession();
    if (session && session.user) {
      location.replace('index.html');
    }
  })();

  async function getSession() {
    if (USE_API) {
      try {
        const r = await fetch('/api/auth', { credentials: 'same-origin' });
        if (r.status === 200) {
          const d = await r.json();
          return d.ok ? d : null;
        }
        return null;
      } catch { return null; }
    }
    // Fallback file://
    try {
      const s = JSON.parse(localStorage.getItem(MOCK_KEY) || 'null');
      if (s && s.exp > Date.now()) return s;
      localStorage.removeItem(MOCK_KEY);
    } catch {}
    return null;
  }

  /* ---------- Login request ---------- */
  async function doLogin(username, password, remember) {
    if (USE_API) {
      try {
        const r = await fetch('/api/auth', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({ action: 'login', username, password, remember })
        });
        let data = {};
        try { data = await r.json(); } catch {}
        return { ok: r.ok && data.ok, error: data.error, status: r.status };
      } catch (e) {
        return { ok: false, error: 'network_error' };
      }
    }
    // Mock fallback (file://)
    await new Promise((r) => setTimeout(r, 400));
    if (username === MOCK_USER && password === MOCK_PASS) {
      const days = remember ? 7 : 1;
      try {
        localStorage.setItem(MOCK_KEY, JSON.stringify({
          user: username,
          exp: Date.now() + days * 24 * 3600 * 1000
        }));
      } catch {}
      return { ok: true };
    }
    return { ok: false, error: 'invalid_credentials' };
  }

  /* ---------- Error messages ---------- */
  function showError(code) {
    const map = {
      invalid_credentials: 'Username atau password salah.',
      missing_fields:      'Username dan password wajib diisi.',
      network_error:       'Tidak bisa terhubung ke server. Cek koneksi kamu.',
      too_many_requests:   'Terlalu banyak percobaan. Coba lagi nanti.',
      default:             'Login gagal. Coba lagi.'
    };
    errBox.textContent = map[code] || map.default;
    errBox.classList.add('show');
  }

  /* ---------- Submit ---------- */
  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    errBox.classList.remove('show');

    const username = userIn.value.trim();
    const password = passIn.value;
    const remember = rememberIn.checked;

    if (!username || !password) {
      showError('missing_fields');
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Memproses...';

    const res = await doLogin(username, password, remember);

    if (res.ok) {
      btn.textContent = 'Berhasil ✓';
      setTimeout(() => location.replace('index.html'), 300);
    } else {
      showError(res.error);
      btn.disabled = false;
      btn.textContent = 'Sign In';
      passIn.value = '';
      passIn.focus();
    }
  });

  document.getElementById('forgotLink').addEventListener('click', function () {
    alert('Hubungi admin untuk reset password.');
  });
})();
</script>
</body>
</html>
