<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Access Denied</title>
<style>
  :root{
    --bg:#05070b;
    --red:#ef4444;
    --red-2:#dc2626;
    --text:#e6edf3;
    --muted:#7a8699;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background:#05070b;
    color:var(--text);
    min-height:100vh;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
    display:grid;
    place-items:center;
    padding:24px;
    position:relative;
  }

  /* Red glow background */
  body::before{
    content:'';
    position:fixed;
    inset:0;
    background:
      radial-gradient(circle at 50% 40%, rgba(239,68,68,.15), transparent 55%),
      radial-gradient(circle at 15% 90%, rgba(239,68,68,.08), transparent 50%),
      radial-gradient(circle at 85% 10%, rgba(239,68,68,.08), transparent 50%);
    pointer-events:none;
    z-index:0;
    animation:breathe 6s ease-in-out infinite;
  }
  @keyframes breathe{
    0%,100%{opacity:.85}
    50%{opacity:1}
  }

  /* Subtle grid scanlines */
  body::after{
    content:'';
    position:fixed;
    inset:0;
    background-image:
      repeating-linear-gradient(0deg, rgba(255,255,255,.015) 0 1px, transparent 1px 3px);
    pointer-events:none;
    z-index:1;
    opacity:.6;
  }

  .container{
    position:relative;
    z-index:2;
    max-width:720px;
    width:100%;
    text-align:center;
    padding:20px 0;
    animation:fadeUp .7s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes fadeUp{
    from{opacity:0; transform:translateY(20px)}
    to{opacity:1; transform:translateY(0)}
  }

  /* Warning icon */
  .warn-icon{
    width:90px;height:90px;
    margin:0 auto 26px;
    border-radius:50%;
    display:grid;place-items:center;
    background:radial-gradient(circle at 30% 30%, rgba(239,68,68,.35), rgba(239,68,68,.08));
    border:2px solid rgba(239,68,68,.5);
    box-shadow:
      0 0 30px rgba(239,68,68,.35),
      inset 0 0 20px rgba(239,68,68,.15);
    animation:pulseIcon 2.2s ease-in-out infinite;
  }
  @keyframes pulseIcon{
    0%,100%{ transform:scale(1); box-shadow:0 0 30px rgba(239,68,68,.35), inset 0 0 20px rgba(239,68,68,.15); }
    50%{ transform:scale(1.05); box-shadow:0 0 50px rgba(239,68,68,.55), inset 0 0 24px rgba(239,68,68,.25); }
  }
  .warn-icon svg{
    width:46px;height:46px;
    color:var(--red);
    stroke-width:2.2;
  }

  /* Main BANNED text */
  .banned-text{
    font-size:clamp(56px, 14vw, 120px);
    font-weight:900;
    letter-spacing:.12em;
    line-height:.95;
    color:var(--red);
    text-transform:uppercase;
    text-shadow:
      0 0 20px rgba(239,68,68,.85),
      0 0 45px rgba(239,68,68,.5),
      0 0 90px rgba(239,68,68,.25);
    margin-bottom:14px;
    font-family:'Impact','Arial Black',-apple-system,sans-serif;
    animation:glow 3s ease-in-out infinite;
  }
  @keyframes glow{
    0%,100%{ text-shadow:0 0 20px rgba(239,68,68,.85), 0 0 45px rgba(239,68,68,.5), 0 0 90px rgba(239,68,68,.25); }
    50%{ text-shadow:0 0 26px rgba(239,68,68,1), 0 0 60px rgba(239,68,68,.6), 0 0 120px rgba(239,68,68,.35); }
  }

  .subtitle{
    font-size:clamp(13px, 2.2vw, 15px);
    color:var(--muted);
    letter-spacing:.35em;
    text-transform:uppercase;
    font-weight:600;
    margin-bottom:36px;
  }

  /* Info card */
  .info-card{
    background:linear-gradient(180deg, #0f141d, #0b0f16);
    border:1px solid rgba(239,68,68,.25);
    border-radius:14px;
    padding:0;
    max-width:520px;
    margin:0 auto 30px;
    overflow:hidden;
    text-align:left;
    box-shadow:0 20px 60px rgba(0,0,0,.6);
  }
  .info-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    padding:14px 18px;
    border-bottom:1px solid rgba(255,255,255,.04);
    font-size:13.5px;
  }
  .info-row:last-child{border-bottom:none;}
  .info-row .key{
    color:var(--muted);
    font-weight:600;
    font-size:11.5px;
    letter-spacing:.5px;
    text-transform:uppercase;
    white-space:nowrap;
  }
  .info-row .val{
    color:var(--text);
    font-weight:700;
    font-family:'SF Mono',Menlo,Consolas,monospace;
    text-align:right;
    word-break:break-word;
  }
  .info-row .val.reason{
    color:#fca5a5;
    font-family:inherit;
    font-weight:600;
  }
  .info-row .val.red{color:var(--red);}
  .info-row .val.dim{color:var(--muted); font-weight:500;}

  /* Buttons */
  .actions{
    display:flex;
    gap:12px;
    justify-content:center;
    flex-wrap:wrap;
    margin-bottom:22px;
  }
  .btn{
    border:none;cursor:pointer;font-family:inherit;
    font-weight:600;font-size:13.5px;
    padding:12px 22px;border-radius:10px;
    transition:transform .15s, box-shadow .2s, background .2s;
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    white-space:nowrap;
  }
  .btn:active{transform:scale(.97);}
  .btn-primary{
    background:linear-gradient(135deg, var(--red), var(--red-2));
    color:#fff;
    box-shadow:0 8px 24px rgba(239,68,68,.4);
  }
  .btn-primary:hover{box-shadow:0 10px 30px rgba(239,68,68,.55);}
  .btn-ghost{
    background:rgba(255,255,255,.04);
    color:var(--text);
    border:1px solid rgba(255,255,255,.08);
  }
  .btn-ghost:hover{background:rgba(255,255,255,.08);}
  .btn svg{width:15px;height:15px;stroke-width:2.2;}

  /* Footer */
  .footer{
    font-size:11.5px;
    color:var(--muted);
    letter-spacing:.3px;
    text-align:center;
    line-height:1.7;
    opacity:.75;
  }
  .footer code{
    background:rgba(255,255,255,.05);
    padding:2px 7px;border-radius:5px;
    color:#94a3b8;
    font-size:11px;
  }

  /* Toast (copied from dashboard) */
  .toast-wrap{
    position:fixed;top:20px;right:16px;left:16px;z-index:300;
    display:flex;flex-direction:column;align-items:flex-end;gap:10px;
    pointer-events:none;
  }
  .toast{
    pointer-events:auto;max-width:360px;width:100%;
    background:linear-gradient(135deg,#1a2233,#141a27);
    border:1px solid rgba(99,102,241,.3);
    border-left:3px solid var(--red);
    border-radius:12px;padding:12px 14px;
    font-size:13px;color:var(--text);
    box-shadow:0 12px 34px rgba(0,0,0,.5);
    animation:slideIn .28s cubic-bezier(.2,.9,.3,1);
  }
  @keyframes slideIn{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:translateX(0)}}

  @media (max-width:640px){
    .container{padding:12px 0;}
    .warn-icon{width:74px;height:74px;margin-bottom:20px;}
    .warn-icon svg{width:38px;height:38px;}
    .subtitle{letter-spacing:.25em;margin-bottom:28px;}
    .info-card{max-width:100%;margin-bottom:24px;}
    .info-row{padding:12px 14px;font-size:12.5px;flex-direction:column;align-items:flex-start;gap:6px;}
    .info-row .val{text-align:left;font-size:13px;}
    .actions{flex-direction:column;}
    .actions .btn{width:100%;}
  }
</style>
</head>
<body>

<div class="container">

  <div class="warn-icon">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"/>
      <line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/>
    </svg>
  </div>

  <div class="banned-text">Banned</div>
  <div class="subtitle">Your account has been suspended</div>

  <div class="info-card">
    <div class="info-row">
      <span class="key">Account</span>
      <span class="val" id="bannedUser">unknown</span>
    </div>
    <div class="info-row">
      <span class="key">Reason</span>
      <span class="val reason" id="bannedReason">—</span>
    </div>
    <div class="info-row">
      <span class="key">Status</span>
      <span class="val red">PERMANENTLY BLOCKED</span>
    </div>
    <div class="info-row">
      <span class="key">Detected</span>
      <span class="val dim" id="bannedAt">—</span>
    </div>
  </div>

  <div class="actions">
    <button class="btn btn-ghost" id="copyIdBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
      Copy Case ID
    </button>
    <button class="btn btn-primary" id="backBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      Back to Login
    </button>
  </div>

  <div class="footer">
    If you believe this is a mistake, contact support with your Case ID.<br>
    <code id="caseId">BAN-000000-XXXX</code>
  </div>

</div>

<div class="toast-wrap" id="toastWrap"></div>

<script src="config.js"></script>
<script>
(function(){
  'use strict';

  /* ============ LOAD BANNED INFO ============ */
  let info = null;
  try {
    const raw = sessionStorage.getItem('banned_info');
    if (raw) info = JSON.parse(raw);
  } catch(e){}

  // Kalau akses langsung tanpa lewat login → kasih info default
  if (!info || !info.user) {
    info = {
      user: 'unknown',
      reason: 'Account suspended by system',
      at: Date.now()
    };
  }

  /* ============ RENDER INFO ============ */
  document.getElementById('bannedUser').textContent = info.user;
  document.getElementById('bannedReason').textContent = info.reason || 'Not specified';

  const dateStr = new Date(info.at || Date.now()).toLocaleString('id-ID', {
    day: '2-digit', month: 'short', year: 'numeric',
    hour: '2-digit', minute: '2-digit'
  });
  document.getElementById('bannedAt').textContent = dateStr;

  /* ============ GENERATE CASE ID ============ */
  function hashStr(s){
    let h = 0;
    for (let i=0;i<s.length;i++){
      h = ((h << 5) - h) + s.charCodeAt(i);
      h |= 0;
    }
    return Math.abs(h).toString(36).toUpperCase().padStart(8,'0').slice(0,8);
  }

  const caseId = 'BAN-' + hashStr(info.user + '|' + (info.reason || '') + '|' + (info.at || 0));
  document.getElementById('caseId').textContent = caseId;

  /* ============ TOAST ============ */
  const toastWrap = document.getElementById('toastWrap');
  function toast(msg){
    const el = document.createElement('div');
    el.className = 'toast';
    el.textContent = msg;
    toastWrap.appendChild(el);
    setTimeout(function(){
      el.style.transition = 'opacity .3s, transform .3s';
      el.style.opacity = '0';
      el.style.transform = 'translateX(30px)';
      setTimeout(function(){ el.remove(); }, 300);
    }, 3000);
  }

  /* ============ COPY CASE ID ============ */
  document.getElementById('copyIdBtn').addEventListener('click', function(){
    const txt = 'Case ID: ' + caseId + ' | Account: ' + info.user + ' | Reason: ' + info.reason;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt).then(
        function(){ toast('Case ID copied: ' + caseId); },
        function(){ toast('Gagal copy — clipboard diblokir'); }
      );
    } else {
      const ta = document.createElement('textarea');
      ta.value = txt;
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); toast('Case ID copied: ' + caseId); }
      catch(e){ toast('Gagal copy Case ID'); }
      ta.remove();
    }
  });

  /* ============ BACK TO LOGIN ============ */
  document.getElementById('backBtn').addEventListener('click', function(){
    try { sessionStorage.removeItem('banned_info'); } catch(e){}
    try { Auth.logout(); } catch(e){}
    location.replace('login.html');
  });

  /* ============ PREVENT BACK BUTTON LOOP ============ */
  history.pushState(null, '', location.href);
  window.addEventListener('popstate', function(){
    history.pushState(null, '', location.href);
  });

})();
</script>
</body>
</html>
